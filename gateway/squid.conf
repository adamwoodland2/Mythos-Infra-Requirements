# /etc/squid/squid.conf  -  CVP lab egress proxy
#
# Explicit (non-transparent) CONNECT proxy with a hostname allow-list.
# No TLS interception, so no custom CA is needed on the Kali VM.
# The allow-list file is swapped between "login" and "run" modes by
# /usr/local/sbin/cvp-mode (see cvp-mode.sh).

# ---- listener ---------------------------------------------------------------
http_port 10.0.3.1:3128

# ---- ACLs -------------------------------------------------------------------
acl lab        src 10.0.3.0/24
acl SSL_ports  port 443
acl Safe_ports port 443
acl CONNECT    method CONNECT

# Active allow-list (symlink managed by cvp-mode).
# -n: match hostnames only. Without it, a CONNECT to a bare IP is reverse-resolved
# and allowed if the PTR record names a listed host - and PTR records are set by
# whoever owns the IP, so any server could claim to be api.anthropic.com.
acl allowed_dst dstdomain -n "/etc/squid/allowlist.txt"

# ---- access policy ----------------------------------------------------------
# Deny CONNECT to anything but 443
http_access deny CONNECT !SSL_ports
# Deny plain HTTP to non-443 ports (nothing we need is plain HTTP)
http_access deny !Safe_ports

# Lab hosts may CONNECT / fetch ONLY allow-listed destinations
http_access allow lab CONNECT allowed_dst
http_access allow lab allowed_dst

# Everything else, from anyone, is denied (and logged as TCP_DENIED)
http_access deny all

# ---- hygiene ----------------------------------------------------------------
# No caching of API traffic
cache deny all
# Do not leak lab topology. Without this every 403 tells the sandbox the gateway's
# hostname and Squid version. Squid 6/7 log "WARNING: HTTP requires the use of Via"
# for this line; that warning is expected.
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
# Short timeouts so a hung API call fails fast
connect_timeout 30 seconds
read_timeout 10 minutes

# ---- logging ----------------------------------------------------------------
# One line per request, including TCP_DENIED for blocked destinations.
# Retention is handled by /etc/logrotate.d/squid (45 days, > the 30-day CVP minimum).
# Custom format = default squid format but with an ISO 8601 local timestamp
# (one field, so the columns line up with the built-in squid format)
logformat cvp %{%Y-%m-%dT%H:%M:%S%z}tl %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt
# stdio writes each line as the request completes (nothing buffered to lose)
access_log  stdio:/var/log/squid/access.log logformat=cvp
cache_log   /var/log/squid/cache.log
# logrotate does the rotating; `squid -k rotate` just reopens the files
logfile_rotate 0
