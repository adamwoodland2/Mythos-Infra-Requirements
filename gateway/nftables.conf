#!/usr/sbin/nft -f
# /etc/nftables.conf  -  CVP lab egress gateway
#
# Interfaces (install-gateway.sh rewrites the two defines below from its
# WAN_IF / LAN_IF settings; check names with `ip -br link`):
#   ens33 = VMware NAT (VMnet8)  -> internet
#   ens37 = VMware LAN Segment "cvp-lab" (10.0.3.0/24), gateway IP 10.0.3.1
#
# Design: NO routing between the lab and NAT interfaces. The lab segment can
# only reach Squid on 10.0.3.1:3128, plus SSH from Kali for the transcript
# drop-box. Everything else is dropped and counted.
# Apply with:  sudo nft -f /etc/nftables.conf   and   sudo systemctl enable nftables

flush ruleset

define LAN_IF   = "ens37"
define WAN_IF   = "ens33"
define LAB_NET  = 10.0.3.0/24
define KALI_IP  = 10.0.3.11

table inet filter {

    chain input {
        type filter hook input priority 0; policy drop;

        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP echo from the lab only (handy for checking the VM is up)
        iifname $LAN_IF ip saddr $LAB_NET icmp type echo-request accept

        # Lab -> Squid explicit proxy (the ONLY sanctioned egress path)
        iifname $LAN_IF ip saddr $LAB_NET tcp dport 3128 accept

        # Transcript drop-box: rsync over SSH from Kali only. sshd itself only
        # lets the cvpsync key in from the lab (sshd_config.d/60-cvp-lab.conf);
        # administer the gateway from the VMware console.
        iifname $LAN_IF ip saddr $KALI_IP tcp dport 22 accept

        # Anything else arriving on the lab interface is logged and dropped
        iifname $LAN_IF log prefix "cvp-lab-input-drop: " counter drop

        # WAN side: accept nothing unsolicited
        iifname $WAN_IF counter drop
    }

    chain forward {
        # Never route the lab anywhere. Log so attempts show up in journald.
        type filter hook forward priority 0; policy drop;
        iifname $LAN_IF log prefix "cvp-lab-forward-drop: " counter drop
        counter drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
        # Gateway's own outbound traffic (Squid upstream, apt during build) is
        # allowed. Tighten to the Anthropic hosts only once the build is done
        # if you want a second layer - see the checklist.
    }
}
